name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CLAUDE_MODEL repository variable을 지정하면 리뷰 모델을 바꿀 수 있다.
      # 없으면 Sonnet 5로 폴백한다.
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 리뷰는 참고용이므로 토큰/크레딧 소진 등으로 실패해도 머지를 막지 않는다.
      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 저장소는 CLAUDE.md에 정의된 프로젝트 규칙(VideoToolbox 하드웨어 가속 우선,
            strict mypy, uv 전용 패키지 관리, DB 접근은 Repository 패턴만 사용, print()
            대신 logger 사용, 하드코딩 경로 금지 등)을 따릅니다. 리뷰 전에 CLAUDE.md를
            참고하세요.

            이 PR을 다음 관점에서 리뷰해 주세요:
            - 정확성과 잠재적 버그, 경계 조건(빈 값/무음 오디오/오디오 스트림 없음/대량
              입력/타임존/정밀도)
            - 보안: 시크릿 노출, subprocess/ffmpeg 인자 주입, 파일 경로 처리
            - CLAUDE.md에 명시된 계약 위반 여부 (DB는 Repository 패턴만 사용하고
              app/cli/main.py 등에서 raw SQL 직접 실행 금지, strict mypy 타입 힌트 누락,
              print() 사용 금지 등)
            - 테스트 커버리지 누락 (특히 tests/unit과 tests/e2e 구분 기준에 맞는지)
            - 요청 범위를 벗어난 변경

            참고: PR 브랜치는 이미 현재 작업 디렉터리에 체크아웃되어 있습니다.

            리뷰 코멘트는 한국어로 작성하세요.
            전체 총평은 `gh pr comment`를 사용하세요.
            특정 코드 라인에 대한 지적은 `mcp__github_inline_comment__create_inline_comment`
            (confirmed: true)를 사용하세요.
            GitHub 코멘트로만 결과를 남기고, 메시지 텍스트로 리뷰 내용을 출력하지 마세요.

          claude_args: |
            --model "${{ env.CLAUDE_MODEL }}"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
